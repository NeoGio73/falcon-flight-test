  // for recording a preview: advance the simulation in fixed steps, then draw
  const ndc = p => { const v = p.clone().project(camera); return [+v.x.toFixed(2), +v.y.toFixed(2), +camera.position.distanceTo(p).toFixed(0)]; };
  window.__banner = { ready, advance(sec, fps = 30, draw = true) { const n = Math.round(sec * fps); for (let i = 0; i < n; i++) step(1 / fps); if (draw) renderer.render(scene, camera); return simT; }, time: () => simT,
    proj: () => ({ t: +simT.toFixed(2), f: ndc(fpos), ties: TIES.map(T => T.alive ? ndc(T.pos) : null), ds: ndc(deathStar.getWorldPosition(new V3())) }) };
}
</script>
